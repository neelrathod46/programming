<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Grading System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; padding:20px; }
table { border-collapse: collapse; width:100%; margin-top:10px;}
th, td { border:1px solid #ccc; padding:8px; text-align:left;}
th { cursor:pointer; background:#f0f0f0; }
.section { margin-bottom:30px; }
</style>
</head>

<body>

<h1>Grading System</h1>

<div class="section">
<h3>Upload CSVs</h3>
Marks CSV: <input type="file" id="marksCsv"><br><br>
Teams CSV: <input type="file" id="teamsCsv">
</div>

<div class="section" id="criteriaSection" style="display:none;">
<h3>Criteria</h3>
<table id="criteriaTable"></table>
</div>

<div class="section" id="cutoffsSection" style="display:none;">
<h3>Grade Cutoffs</h3>
<div id="cutoffs"></div>
</div>

<button onclick="calculate()">Calculate</button>

<div class="section" id="resultsSection" style="display:none;">
<h3>Results</h3>

<div id="exportOptions">
<label><input type="checkbox" value="name" checked>Name</label>
<label><input type="checkbox" value="total" checked>Total</label>
<label><input type="checkbox" value="grade" checked>Grade</label>
</div>

<button onclick="exportCSV()">Export</button>

<table id="resultsTable"></table>

<canvas id="bell"></canvas>
<canvas id="cumulative"></canvas>
<canvas id="histogram"></canvas>

</div>

<script>
let criteria=[], students=[], rawStudents=[];
let teams={}, teamCriteria=new Set();
let results=[];

const gradeOrder=['A','A-','B','B-','C','C-','F'];
let cutoffs={A:85,'A-':80,B:70,'B-':60,C:50,'C-':40,F:0};

document.getElementById('marksCsv').onchange=e=>{
    const r=new FileReader();
    r.onload=ev=>parseMarks(ev.target.result);
    r.readAsText(e.target.files[0]);
};

document.getElementById('teamsCsv').onchange=e=>{
    const r=new FileReader();
    r.onload=ev=>parseTeams(ev.target.result);
    r.readAsText(e.target.files[0]);
};

function parseMarks(text){
    let lines = text.trim().split('\n');
    let headers = lines[0].split(',');

    // normalize function (handles spaces, hyphens, case)
    function normalize(str) {
        return str.toLowerCase().replace(/[\s-_]/g, '');
    }

    const defaultConfig = {
        'midsem': { max: 50, weight: 15 },
        'endsem': { max: 50, weight: 20 },
        'quiz1': { max: 50, weight: 7.5 },
        'quiz2': { max: 50, weight: 7.5 },
        'presentation': { max: 25, weight: 25 },
        'lab': { max: 15, weight: 15 },
        'project': { max: 10, weight: 10 }
    };

    criteria = [];

    for (let i = 1; i < headers.length; i++) {
        let raw = headers[i];
        let key = normalize(raw);

        let config = defaultConfig[key] || { max: 100, weight: 0 };

        criteria.push({
            id: i,
            name: raw,
            max: config.max,
            weight: config.weight
        });
    }

    students = [];

    for (let i = 1; i < lines.length; i++) {
        let cols = lines[i].split(',');
        let s = { name: cols[0], marks: {} };

        for (let j = 1; j < cols.length; j++) {
            let val = parseFloat(cols[j]);
            s.marks[j] = isNaN(val) ? 0 : val;
        }

        students.push(s);
    }

    rawStudents = [...students];

    renderCriteria();
}

function parseTeams(text){
    teams={};
    let lines=text.trim().split('\n');

    lines.forEach(line=>{
        let cols=line.split(',');
        let team=cols[0];
        teams[team]={members:cols.slice(1)};
    });
}

function renderCriteria(){
    let html="<tr><th>Name</th><th>Max</th><th>Weight</th><th>Team?</th></tr>";
    criteria.forEach(c=>{
        html+=`
        <tr>
        <td>${c.name}</td>
        <td><input value="${c.max}" onchange="cmax(${c.id},this.value)"></td>
        <td><input value="${c.weight}" onchange="cweight(${c.id},this.value)"></td>
        <td><input type="checkbox" onchange="cteam(${c.id},this.checked)"></td>
        </tr>`;
    });
    document.getElementById('criteriaTable').innerHTML=html;

    renderCutoffs();
    document.getElementById('criteriaSection').style.display='block';
}

function cmax(id,v){criteria.find(c=>c.id==id).max=+v;}
function cweight(id,v){criteria.find(c=>c.id==id).weight=+v;}
function cteam(id,ch){ ch?teamCriteria.add(id):teamCriteria.delete(id); }

function renderCutoffs(){
    let d=document.getElementById('cutoffs');
    d.innerHTML="";
    gradeOrder.forEach(g=>{
        d.innerHTML+=`${g} >= <input value="${cutoffs[g]}" onchange="cutoffs['${g}']=+this.value"><br>`;
    });
    document.getElementById('cutoffsSection').style.display='block';
}

function applyTeams(){
    students=rawStudents.map(s=>({...s,marks:{...s.marks}}));

    Object.values(teams).forEach(t=>{
        let ref=students.find(s=>t.members.includes(s.name));
        if(!ref)return;

        t.members.forEach(name=>{
            let st=students.find(s=>s.name==name);
            if(!st)return;

            teamCriteria.forEach(cid=>{
                st.marks[cid]=ref.marks[cid];
            });
        });
    });
}

function grade(score){
    for(let g of gradeOrder){
        if(score>=cutoffs[g]) return g;
    }
    return 'F';
}

function calculate(){
    applyTeams();

    results=students.map(s=>{
        let total=0;
        criteria.forEach(c=>{
            total+=(s.marks[c.id]/c.max)*c.weight;
        });
        return {...s,total,grade:grade(total)};
    });

    renderTable();
    charts();
    document.getElementById('resultsSection').style.display='block';
}

function renderTable(){
    let html="<tr><th onclick=\"sort('name')\">Name</th><th onclick=\"sort('total')\">Total</th><th onclick=\"sort('grade')\">Grade</th></tr>";
    results.forEach(r=>{
        html+=`<tr><td>${r.name}</td><td>${r.total.toFixed(2)}</td><td>${r.grade}</td></tr>`;
    });
    document.getElementById('resultsTable').innerHTML=html;
}

function sort(key){
    results.sort((a,b)=>{
        if(key==='name') return a.name.localeCompare(b.name);
        if(key==='total') return b.total-a.total;
        if(key==='grade') return a.grade.localeCompare(b.grade);
    });
    renderTable();
}

function exportCSV(){
    let sel=[...document.querySelectorAll('#exportOptions input:checked')].map(x=>x.value);

    let csv="";
    if(sel.includes('name')) csv+="Name,";
    if(sel.includes('total')) csv+="Total,";
    if(sel.includes('grade')) csv+="Grade,";
    csv+="\n";

    results.forEach(r=>{
        let row="";
        if(sel.includes('name')) row+=r.name+",";
        if(sel.includes('total')) row+=r.total+",";
        if(sel.includes('grade')) row+=r.grade+",";
        csv+=row+"\n";
    });

    let blob=new Blob([csv]);
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="grades.csv";
    a.click();
}

function charts(){
    let scores=results.map(r=>r.total);
    let mean=scores.reduce((a,b)=>a+b)/scores.length;
    let sd=Math.sqrt(scores.reduce((a,b)=>a+(b-mean)**2,0)/scores.length);

    // bell
    let pts=[];
    for(let x=mean-3*sd;x<=mean+3*sd;x+=sd/10){
        pts.push({x,y:Math.exp(-0.5*((x-mean)/sd)**2)});
    }

    new Chart(bell,{type:'line',data:{datasets:[{data:pts}]},options:{scales:{x:{type:'linear'}}}});

    // cumulative
    let sorted=[...scores].sort((a,b)=>a-b);
    let cum=sorted.map((v,i)=>({x:v,y:(i+1)/sorted.length}));

    new Chart(cumulative,{type:'line',data:{datasets:[{data:cum}]},options:{scales:{x:{type:'linear'},y:{min:0,max:1}}}});

    // histogram
    let bins=Array(10).fill(0);
    scores.forEach(s=>{
        bins[Math.min(Math.floor(s/10),9)]++;
    });

    new Chart(histogram,{
        type:'bar',
        data:{labels:bins.map((_,i)=>i*10+"-"+(i*10+10)),datasets:[{data:bins}]}
    });
}
</script>

</body>
</html>
